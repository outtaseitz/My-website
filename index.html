<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>LUTZ ON THE WEB</title>

  <style>
    html, body {
      height: 100%;
      margin: 0;
      background-color: #050505;
      overflow: hidden;
      font-family: "Inter", system-ui, sans-serif;
    }

    /* Background text pattern */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 0;

      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='120'><text x='0' y='70' font-family='Arial' font-size='48' opacity='0.07' fill='white'>lutz lutz lutz lutz lutz</text></svg>");
      background-repeat: repeat;

      transform: rotate(45deg) scale(1.5);
      transform-origin: center;

      animation: diagonalScroll 15s linear infinite;
    }

    @keyframes diagonalScroll {
      from { background-position: 0 0; }
      to   { background-position: 300px -300px; }
    }

    /* Foreground container */
    .wrap {
      position: relative;
      z-index: 1;
      height: 100%;
      display: grid;
      place-items: center;
      text-align: center;
    }

    /* NEON TEXT */
    h1 {
      margin: 0;
      font-size: clamp(60px, 14vw, 20vw);
      font-weight: 900;
      text-transform: uppercase;
      color: #00eaff;

      /* neon glow layers */
      text-shadow:
        0 0 8px   #00eaff,
        0 0 14px  #00eaff,
        0 0 22px  #00eaff,
        0 0 40px  #00bcd4,
        0 0 60px  #0097a7,
        0 0 90px  #006064;

      animation: neonPulse 2.4s ease-in-out infinite alternate,
                 neonFlicker 6s infinite;
    }

    /* slow breathing brightness pulse */
    @keyframes neonPulse {
      0% { opacity: 0.85; }
      100% { opacity: 1; }
    }

    /* occasional gentle flicker */
    @keyframes neonFlicker {
      0%, 97%, 100% { filter: brightness(1); }
      98% { filter: brightness(0.4); }
      99% { filter: brightness(1.3); }
    }
  </style>
</head>

<body>
  <div class="wrap">
    <h1>LUTZ ON THE WEB</h1>
  </div>
</body>
</html>
