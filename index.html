<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LUTZ ON THE WEB</title>
    <style>
        /*
        =====================================
        CORE STYLES
        =====================================
        */
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #FFFFFF;
            color: #111111;
        }
        
        body {
            /* This is a modern way to center content */
            display: grid;
            place-items: center;
            /* Apply the new background style */
            background-color: #f7f7f7; /* Slightly off-white for better contrast */
        }

        /*
        =====================================
        REPEATING TEXT BACKGROUND
        =====================================
        */
        .text-background {
            /* We use a single, rotated "LUTZ" in the SVG tile.
               The fill color is set to 0.05 opacity (5%) for subtlety. */
            background-image: 
                url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='250' height='250'><text x='25' y='125' font-family='sans-serif' font-size='50' font-weight='700' fill='rgba(0,0,0,0.05)' transform='rotate(45, 25, 125)'>LUTZ</text></svg>");
            
            /* Set the repeating tile size. Adjusting this size changes the density. */
            background-size: 250px 250px; 
            background-attachment: fixed;
        }

        /*
        =====================================
        HEADING STYLES
        =====================================
        */
        h1 {
            font-size: 8vw;
            text-align: center;
            font-weight: 900;
            padding: 20px 40px;
            /* Use a rounded, slightly transparent card to lift the text off the background */
            background-color: rgba(255, 255, 255, 0.95); 
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1); 
            letter-spacing: 2px;
        }

        /* Responsive adjustment for small screens */
        @media (max-width: 600px) {
            h1 {
                font-size: 14vw;
                padding: 15px 30px;
            }
        }
    </style>
</head>
<body class="text-background">
    
    <h1>LUTZ ON THE WEB</h1>

</body>
</html>
