<!doctype html>

<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>LUTZ ON THE WEB</title>  <style>
    :root {
      --cyan: #00eaff;
      --blue: #006cff;
      --purple: #8a2cff;
      --bg: #03040a;
      --text: #eaffff;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      margin: 0;
      overflow: hidden;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 20% 20%, rgba(0, 234, 255, 0.18), transparent 32%),
        radial-gradient(circle at 80% 70%, rgba(138, 44, 255, 0.22), transparent 34%),
        linear-gradient(135deg, #02030a 0%, #050814 45%, #02030a 100%);
      color: var(--text);
    }

    /* Moving background text pattern */
    body::before {
      content: "";
      position: fixed;
      inset: -40%;
      z-index: 0;
      opacity: 0.8;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='360' height='140'><text x='0' y='82' font-family='Arial Black, Arial' font-size='52' opacity='0.08' fill='white'>lutz lutz lutz lutz</text></svg>");
      background-repeat: repeat;
      transform: rotate(35deg) scale(1.2);
      animation: diagonalScroll 18s linear infinite;
    }

    /* Soft animated glow blobs */
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at 35% 45%, rgba(0, 234, 255, 0.22), transparent 18%),
        radial-gradient(circle at 65% 55%, rgba(138, 44, 255, 0.20), transparent 22%);
      filter: blur(30px);
      animation: glowDrift 8s ease-in-out infinite alternate;
    }

    @keyframes diagonalScroll {
      from { background-position: 0 0; }
      to   { background-position: 360px -360px; }
    }

    @keyframes glowDrift {
      from {
        transform: translate3d(-2%, -2%, 0) scale(1);
        opacity: 0.7;
      }
      to {
        transform: translate3d(2%, 2%, 0) scale(1.08);
        opacity: 1;
      }
    }

    .wrap {
      position: relative;
      z-index: 1;
      min-height: 100%;
      display: grid;
      place-items: center;
      padding: 24px;
      text-align: center;
    }

    .card {
      width: min(920px, 94vw);
      padding: clamp(32px, 7vw, 72px);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 32px;
      background: rgba(5, 8, 20, 0.56);
      box-shadow:
        0 0 60px rgba(0, 234, 255, 0.18),
        0 0 100px rgba(138, 44, 255, 0.14),
        inset 0 0 40px rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(18px);
    }

    .eyebrow {
      margin: 0 0 16px;
      font-size: clamp(12px, 2vw, 15px);
      letter-spacing: 0.38em;
      text-transform: uppercase;
      color: rgba(234, 255, 255, 0.72);
    }

    h1 {
      margin: 0;
      font-size: clamp(48px, 11vw, 150px);
      line-height: 0.9;
      font-weight: 950;
      letter-spacing: -0.08em;
      text-transform: uppercase;
      color: var(--cyan);
      text-shadow:
        0 0 8px   rgba(0, 234, 255, 0.95),
        0 0 18px  rgba(0, 234, 255, 0.85),
        0 0 36px  rgba(0, 188, 212, 0.70),
        0 0 70px  rgba(0, 108, 255, 0.55);
      animation:
        neonPulse 2.6s ease-in-out infinite alternate,
        neonFlicker 7s infinite;
    }

    .subtitle {
      max-width: 620px;
      margin: 24px auto 0;
      font-size: clamp(16px, 2.3vw, 22px);
      line-height: 1.5;
      color: rgba(234, 255, 255, 0.78);
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-top: 34px;
      padding: 13px 22px;
      border: 1px solid rgba(0, 234, 255, 0.55);
      border-radius: 999px;
      color: var(--text);
      text-decoration: none;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      background: linear-gradient(135deg, rgba(0, 234, 255, 0.12), rgba(138, 44, 255, 0.18));
      box-shadow:
        0 0 20px rgba(0, 234, 255, 0.22),
        inset 0 0 18px rgba(255, 255, 255, 0.04);
      transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
    }

    .button:hover {
      transform: translateY(-2px);
      border-color: rgba(0, 234, 255, 0.9);
      box-shadow:
        0 0 28px rgba(0, 234, 255, 0.38),
        0 0 46px rgba(138, 44, 255, 0.18);
    }

    @keyframes neonPulse {
      0% {
        opacity: 0.86;
        filter: saturate(0.95);
      }
      100% {
        opacity: 1;
        filter: saturate(1.25);
      }
    }

    @keyframes neonFlicker {
      0%, 96%, 100% { filter: brightness(1); }
      97% { filter: brightness(0.55); }
      98% { filter: brightness(1.35); }
      99% { filter: brightness(0.85); }
    }

    @media (max-width: 520px) {
      .card {
        border-radius: 24px;
      }

      h1 {
        letter-spacing: -0.06em;
      }

      .eyebrow {
        letter-spacing: 0.25em;
      }
    }
  </style></head><body>
  <main class="wrap">
    <section class="card">
      <p class="eyebrow">Welcome to</p>
      <h1>LUTZ ON THE WEB</h1>
      <p class="subtitle">A little corner of the internet with style, glow, and questionable amounts of neon.</p>
      <a class="button" href="#">Enter</a>
    </section>
  </main>
</body>
</html>
