<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>LUTZ ON THE WEB</title>

  <style>
    html, body {
      height: 100%;
      margin: 0;
      font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, Arial;
      background-color: #ffffff;
      overflow: hidden;
    }

    /* Background layer */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 0;

      /* repeating “lutz” text */
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='120'><text x='0' y='70' font-family='Arial' font-size='48' opacity='0.06'>lutz lutz lutz lutz lutz</text></svg>");
      background-repeat: repeat;

      /* Rotate the whole pattern 45° */
      transform: rotate(45deg) scale(1.4);
      transform-origin: center;

      /* Animate the pattern INSIDE the rotated plane */
      animation: diagonalScroll 15s linear infinite;
    }

    /* Scroll the background in place along a -45° diagonal */
    @keyframes diagonalScroll {
      from {
        background-position: 0 0;
      }
      to {
        background-position: 300px -300px;
      }
    }

    /* Foreground */
    .wrap {
      position: relative;
      z-index: 1;
      height: 100%;
      display: grid;
      place-items: center;
      text-align: center;
    }

    h1 {
      margin: 0;
      font-size: clamp(48px, 12vw, 18vw);
      font-weight: 900;
      text-transform: uppercase;
      color: #0b1220;
      text-shadow: 0 3px 10px rgba(0,0,0,0.14);
      line-height: .85;
    }
  </style>
</head>

<body>
  <div class="wrap">
    <h1>LUTZ ON THE WEB</h1>
  </div>
</body>
</html>
