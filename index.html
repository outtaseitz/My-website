<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>LUTZ ON THE WEB</title>

  <style>
    html, body {
      height: 100%;
      margin: 0;
      font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, Arial;
      background-color: #ffffff;
      overflow: hidden; /* prevents scrollbars */
    }

    /* Background layer */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 0;

      /* repeating “lutz” SVG pattern */
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='120'><text x='0' y='70' font-family='Arial' font-size='48' opacity='0.06'>lutz lutz lutz lutz lutz</text></svg>");
      background-repeat: repeat;

      /* rotate the entire background 45° */
      transform: rotate(45deg) scale(1.5);
      transform-origin: center;

      /* smooth look */
      -webkit-font-smoothing: antialiased;

      /* scrolling animation */
      animation: scrollbg 30s linear infinite;
    }

    /* Diagonal scroll animation */
    @keyframes scrollbg {
      from {
        background-position: 0 0;
      }
      to {
        background-position: 600px 600px; /* adjust speed/direction here */
      }
    }

    /* Foreground container */
    .wrap {
      position: relative;
      z-index: 1;
      height: 100%;
      display: grid;
      place-items: center;
      text-align: center;
      padding: 2rem;
      box-sizing: border-box;
    }

    /* Main title */
    h1 {
      margin: 0;
      font-size: clamp(48px, 12vw, 18vw);
      font-weight: 900;
      text-transform: uppercase;
      color: #0b1220;
      text-shadow: 0 3px 10px rgba(0,0,0,0.15);
      line-height: .85;
    }
  </style>
</head>

<body>
  <div class="wrap">
    <h1>LUTZ ON THE WEB</h1>
  </div>
</body>
</html>
