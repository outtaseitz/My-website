<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LUTZ ON THE WEB</title>
    <style>
        /*
        =====================================
        PURE TEXT REPEATING BACKGROUND CSS
        =====================================
        */
        .text-background {
            /* This embeds the SVG image of the word "LUTZ" rotated 45 degrees.
            I've increased the font size and font weight for better visibility.
            */
            background-image: 
                url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='250' height='150'><text x='0' y='100' font-family='Arial Black, sans-serif' font-size='40' font-weight='900' fill='rgba(0,0,0,0.07)' transform='rotate(45, 0, 100)'>LUTZ</text><text x='125' y='125' font-family='Arial Black, sans-serif' font-size='40' font-weight='900' fill='rgba(0,0,0,0.07)' transform='rotate(45, 125, 125)'>LUTZ</text></svg>");
            
            /* Set the repeating tile size */
            background-size: 250px 150px; 
            background-attachment: fixed;
        }
        
        /*
        =====================================
        EXISTING STYLES
        =====================================
        */
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #FFFFFF;
            color: #111111;
        }
        body {
            display: grid;
            place-items: center;
        }

        h1 {
            font-size: 8vw;
            text-align: center;
            font-weight: 700;
            padding: 10px 20px;
            /* Using a white background with high transparency to ensure the heading text is readable */
            background-color: rgba(255, 255, 255, 0.9); 
            border-radius: 5px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1); /* Adds a little lift/pop */
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 14vw;
            }
        }
    </style>
</head>
<body class="text-background">
    
    <h1>LUTZ ON THE WEB</h1>

</body>
</html>
